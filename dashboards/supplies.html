<!doctype html>
<!-- สร้างจาก dashboards/_template.html (คำอธิบายแต่ละตัวเลือกดูที่ไฟล์นั้น) · ใช้ชุดข้อมูล "supplies" (รายงานการแจกจ่ายถุงยังชีพ) -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<link href="shared/simple-dashboard.css" rel="stylesheet">
</head>
<body>
<script src="shared/csv.js"></script>
<script src="shared/simple-dashboard.js"></script>
<script>
renderDashboard({
  title: 'การแจกจ่ายถุงยังชีพรายจังหวัด',
  eyebrow: 'รายงานการแจกจ่ายถุงยังชีพ · รายจังหวัด',
  dataset: 'supplies',
  headerFirstColumn: 'date',
  groupBy: 'province',
  sortBy: 'delivered_kits',
  kpis: [
    { label: 'แจกจ่ายแล้ว', column: 'delivered_kits', unit: 'ชุด' },
    { label: 'ตามแผน', column: 'planned_kits', unit: 'ชุด' },
    { label: 'ครัวเรือนที่ได้รับ', column: 'households', unit: 'ครัวเรือน' },
    { label: 'อาสาสมัคร', column: 'volunteers', unit: 'คน-ครั้ง' },
  ],
  tableTitle: 'การแจกจ่ายแยกตามจังหวัด',
  columns: [
    { label: 'จังหวัด', column: 'province' },
    { label: 'ภาค', column: 'region' },
    { label: 'จุดแจกจ่าย', distinct: 'distribution_point' },
    { label: 'ตามแผน (ชุด)', column: 'planned_kits', number: true },
    { label: 'แจกจ่ายแล้ว (ชุด)', column: 'delivered_kits', number: true },
    { label: 'ครัวเรือนที่ได้รับ', column: 'households', number: true },
    { label: 'อาสาสมัคร (คน-ครั้ง)', column: 'volunteers', number: true },
  ],
});
</script>
</body>
</html>
